version: '3.8'
services:
  mongo:
    image: mongo:8.0
    container_name: mongo
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
      - .:/usr/src/app

  web:
    image: ghcr.io/oumayma02/smartbusbackend:${IMAGE_TAG:-devops}
    container_name: smartbusbackend-web-1
    restart: always
    depends_on:
      - mongo
    environment:
      - MONGO_URI=mongodb://mongo:27017/iptsdb
    ports:
      - "80:80"
      - "443:443"

volumes:
  mongo_data:
