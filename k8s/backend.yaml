apiVersion: apps/v1
kind: Deployment
metadata:
  name: smartbus-backend
  namespace: smartbus
spec:
  replicas: 1
  selector:
    matchLabels:
      app: smartbus-backend
  template:
    metadata:
      labels:
        app: smartbus-backend
    spec:
      containers:
        - name: backend
          image: ghcr.io/oumayma02/smartbusbackend:fb1957c09a7a98296a9805a53635760a7cc7071f
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
          envFrom:
            - configMapRef:
                name: smartbus-backend-config
          env:
            - name: MONGO_URI
              valueFrom:
                secretKeyRef:
                  name: smartbus-backend-mongo-uri
                  key: MONGO_URI
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: smartbus-backend
  namespace: smartbus
spec:
  selector:
    app: smartbus-backend
  ports:
    - name: http
      port: 80
      targetPort: http
  type: ClusterIP
