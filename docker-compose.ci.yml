services:
  mongo:
    image: mongo:8.0.17
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:?Required}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?Required}
      MONGO_APP_USERNAME: ${MONGO_APP_USERNAME:?Required}
      MONGO_APP_PASSWORD: ${MONGO_APP_PASSWORD:?Required}
      MONGO_INITDB_DATABASE: iptsdb
    volumes:
      - ./docker/mongo-init-ci.sh:/docker-entrypoint-initdb.d/10-init-ci.sh:ro
    healthcheck:
      test:
        - CMD
        - mongosh
        - --quiet
        - --username
        - ${MONGO_ROOT_USERNAME:?Required}
        - --password
        - ${MONGO_ROOT_PASSWORD:?Required}
        - --authenticationDatabase
        - admin
        - --eval
        - "quit(db.adminCommand('ping').ok === 1 ? 0 : 1)"
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  web:
    image: ghcr.io/oumayma02/smartbusbackend:${IMAGE_TAG:?Required}
    environment:
      MONGO_URI: mongodb://${MONGO_APP_USERNAME:?Required}:${MONGO_APP_PASSWORD:?Required}@mongo:27017/iptsdb?authSource=iptsdb
      PORT: "80"
    depends_on:
      mongo:
        condition: service_healthy
    ports:
      - "127.0.0.1:8085:80"
