
name: SmartBus CI/CD

on:
  push:
    branches:
      - main
      - devops
      - jenkins-cd-clean
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build, Scan and Test
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    env:
      COMPOSE_PROJECT_NAME: smartbus-ci
      IMAGE_NAME: ghcr.io/oumayma02/smartbusbackend
      IMAGE_TAG: ${{ github.sha }}

    steps:
      - name: Checkout source code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run automated tests
        run: npm test

      - name: Build Docker image
        run: docker build -t "smartbus-backend:${IMAGE_TAG}" .

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: smartbus-backend:${{ github.sha }}
          format: table
          exit-code: '1'
          ignore-unfixed: true
          severity: CRITICAL,HIGH

      - name: Generate temporary MongoDB credentials
        run: |
          {
            echo "MONGO_ROOT_USERNAME=ci_admin"
            echo "MONGO_ROOT_PASSWORD=$(openssl rand -hex 32)"
            echo "MONGO_APP_USERNAME=ci_smartbus"
            echo "MONGO_APP_PASSWORD=$(openssl rand -hex 32)"
          } >> "$GITHUB_ENV"

      - name: Start isolated integration stack
        run: |
          docker tag "smartbus-backend:${IMAGE_TAG}" "${IMAGE_NAME}:${IMAGE_TAG}"
          docker compose -p "$COMPOSE_PROJECT_NAME" -f docker-compose.ci.yml up -d

      - name: Verify MongoDB administrator authentication
        run: |
          docker compose -p "$COMPOSE_PROJECT_NAME" -f docker-compose.ci.yml exec -T mongo \
            mongosh --quiet \
            --username "$MONGO_ROOT_USERNAME" \
            --password "$MONGO_ROOT_PASSWORD" \
            --authenticationDatabase admin \
            --eval "quit(db.adminCommand('ping').ok === 1 ? 0 : 1)"

      - name: Verify MongoDB application user
        run: |
          docker compose -p "$COMPOSE_PROJECT_NAME" -f docker-compose.ci.yml exec -T mongo \
            mongosh --quiet \
            --username "$MONGO_APP_USERNAME" \
            --password "$MONGO_APP_PASSWORD" \
            --authenticationDatabase iptsdb \
            iptsdb \
            --eval "quit(db.runCommand({find:'users', limit:1}).ok === 1 ? 0 : 1)"

      - name: Verify API health
        run: |
          for i in $(seq 1 30); do
            if curl --silent --show-error --fail http://127.0.0.1:8085/api/health; then
              echo
              exit 0
            fi
            sleep 3
          done

          docker compose -p "$COMPOSE_PROJECT_NAME" -f docker-compose.ci.yml ps
          exit 1

      - name: Show integration logs
        if: always()
        run: |
          docker compose -p "$COMPOSE_PROJECT_NAME" -f docker-compose.ci.yml logs web mongo

      - name: Clean up integration stack
        if: always()
        run: |
          docker compose -p "$COMPOSE_PROJECT_NAME" -f docker-compose.ci.yml down -v

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish immutable image
        if: github.event_name == 'push'
        run: docker push "${IMAGE_NAME}:${IMAGE_TAG}"

      - name: Publish devops tag
        if: github.event_name == 'push' && github.ref == 'refs/heads/devops'
        run: |
          docker tag "${IMAGE_NAME}:${IMAGE_TAG}" "${IMAGE_NAME}:devops"
          docker push "${IMAGE_NAME}:devops"
