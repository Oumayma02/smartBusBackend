
name: SmartBus CI/CD

on:
  push:
    branches: [main, devops]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build, Scan and Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout source code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run automated tests
        run: npm test

      - name: Build Docker image
        run: docker build -t smartbus-backend:${{ github.sha }} .

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: smartbus-backend:${{ github.sha }}
          format: table
          exit-code: '1'
          ignore-unfixed: true
          severity: CRITICAL,HIGH

      - name: Generate temporary MongoDB credentials
        run: |
          echo "MONGO_ROOT_USERNAME=ci_admin" >> "$GITHUB_ENV"
          echo "MONGO_ROOT_PASSWORD=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          echo "MONGO_APP_USERNAME=ci_smartbus" >> "$GITHUB_ENV"
          echo "MONGO_APP_PASSWORD=$(openssl rand -hex 32)" >> "$GITHUB_ENV"

      - name: Start isolated integration stack
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker tag smartbus-backend:${{ github.sha }} \
            ghcr.io/oumayma02/smartbusbackend:${{ github.sha }}

          docker compose -f docker-compose.ci.yml up -d

      - name: Verify MongoDB and API health
        run: |
          for i in $(seq 1 30); do
            if docker compose -f docker-compose.ci.yml ps --status running | grep -q web; then
              if curl --silent --fail http://127.0.0.1:8085/api/health; then
                echo
                exit 0
              fi
            fi
            sleep 3
          done

          docker compose -f docker-compose.ci.yml ps
          exit 1

      - name: Verify MongoDB administrator authentication
        run: |
          docker compose -f docker-compose.ci.yml exec -T mongo \
            mongosh --quiet \
            --username "$MONGO_ROOT_USERNAME" \
            --password "$MONGO_ROOT_PASSWORD" \
            --authenticationDatabase admin \
            --eval "quit(db.adminCommand('ping').ok === 1 ? 0 : 1)"

      - name: Verify MongoDB application user
        run: |
          docker compose -f docker-compose.ci.yml exec -T mongo \
            mongosh --quiet \
            --username "$MONGO_APP_USERNAME" \
            --password "$MONGO_APP_PASSWORD" \
            --authenticationDatabase iptsdb \
            iptsdb \
            --eval "quit(db.runCommand({find:'users', limit:1}).ok === 1 ? 0 : 1)"

      - name: Show integration logs
        if: always()
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker compose -f docker-compose.ci.yml logs web mongo

      - name: Clean up integration stack
        if: always()
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: docker compose -f docker-compose.ci.yml down -v


      - name: Clean up integration stack
        if: always()
        run: docker compose -f docker-compose.ci.yml down -v

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish immutable image
        if: github.event_name == 'push'
        run: |
          docker push ghcr.io/oumayma02/smartbusbackend:${{ github.sha }}

      - name: Publish devops tag
        if: github.event_name == 'push' && github.ref == 'refs/heads/devops'
        run: |
          IMAGE=ghcr.io/oumayma02/smartbusbackend
          docker tag "$IMAGE:${{ github.sha }}" "$IMAGE:devops"
          docker push "$IMAGE:devops"
