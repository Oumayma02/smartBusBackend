name: SmartBus CI/CD

on:
  push:
    branches:
      - main
      - devops
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build, Scan and Test
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout source code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run automated tests
        run: npm test

      - name: Build multi-stage Docker image
        run: |
          docker build \
            -t smartbus-backend:${{ github.sha }} \
            .

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: smartbus-backend:${{ github.sha }}
          format: table
          exit-code: '1'
          ignore-unfixed: true
          severity: CRITICAL,HIGH

      - name: Tag image for local integration tests
        run: |
          docker tag \
            smartbus-backend:${{ github.sha }} \
            ghcr.io/oumayma02/smartbusbackend:${{ github.sha }}

      - name: Start SmartBus integration test stack
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: docker compose up -d

      - name: Wait for services
        run: |
          sleep 15
          docker compose ps

      - name: Check MongoDB
        run: |
          docker compose exec -T mongo \
            mongosh --quiet --eval "db.adminCommand('ping').ok"

      - name: Check API health
        run: |
          curl --fail --retry 10 --retry-delay 3 \
            http://localhost/api/health

      - name: Show application logs
        if: always()
        run: |
          docker compose logs web
          docker compose logs mongo

      - name: Stop integration test stack
        if: always()
        run: docker compose down

      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push immutable image to GHCR
        if: github.event_name == 'push'
        run: |
          docker push \
            ghcr.io/oumayma02/smartbusbackend:${{ github.sha }}

      - name: Update devops image tag
        if: github.event_name == 'push' && github.ref == 'refs/heads/devops'
        run: |
          IMAGE=ghcr.io/oumayma02/smartbusbackend
          docker tag "$IMAGE:${{ github.sha }}" "$IMAGE:devops"
          docker push "$IMAGE:devops"

  deploy:
    name: Deploy to Ubuntu VM
    needs: build-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: self-hosted

    permissions:
      contents: read
      packages: read

    env:
      IMAGE_TAG: ${{ github.sha }}

    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull validated Docker image
        run: |
          docker pull \
            ghcr.io/oumayma02/smartbusbackend:${IMAGE_TAG}

      - name: Deploy SmartBus
        run: |
          cd ~/projects/smartBusBackend
          docker compose pull web
          docker compose up -d

      - name: Verify deployment
        run: |
          sleep 10
          curl --fail --retry 5 --retry-delay 3 \
            http://localhost/api/health
