name: SmartBus CI

on:
  push:
    branches:
      - main
      - devops

  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    name: Build and Integration Test
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout source code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install Node.js dependencies
        run: npm ci

      - name: Run automated tests
        run: npm test

      - name: Validate Dockerfile
        run: docker build -t smartbus-backend:${{ github.sha }} .

      - name: Scan Docker image for vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: smartbus-backend:${{ github.sha }}
          format: table
          exit-code: '0'
          ignore-unfixed: true
          severity: CRITICAL,HIGH
         
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push Docker image to GHCR
        run: |
          IMAGE_NAME=ghcr.io/oumayma02/smartbusbackend
          docker tag smartbus-backend:${{ github.sha }} $IMAGE_NAME:${{ github.sha }}
          docker tag smartbus-backend:${{ github.sha }} $IMAGE_NAME:devops
          docker push $IMAGE_NAME:${{ github.sha }}
          docker push $IMAGE_NAME:devops      

      - name: Start SmartBus stack
        run: docker compose up -d

      - name: Wait for services
        run: |
          echo "Waiting for SmartBus services..."
          sleep 15
          docker compose ps

      - name: Check MongoDB
        run: |
          docker compose ps mongo
          docker compose exec -T mongo mongosh --quiet --eval "db.adminCommand('ping').ok"

      - name: Check SmartBus health endpoint
        run: |
          curl --fail --retry 10 --retry-delay 3 \
            http://localhost/api/health

      - name: Show application logs
        if: always()
        run: |
          docker compose logs web
          docker compose logs mongo

      - name: Stop SmartBus stack
        if: always()
        run: docker compose down

  deploy:
    name: Deploy to Ubuntu VM
    needs: build-and-test
    runs-on: self-hosted

    permissions:
      contents: read
      packages: read

    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull immutable Docker image
        run: docker pull ghcr.io/oumayma02/smartbusbackend:${{ github.sha }}

      - name: Deploy SmartBus
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          cd ~/projects/smartBusBackend
          docker compose pull web
          docker compose up -d

      - name: Verify deployment
        run: |
          sleep 10
          curl --fail http://localhost/api/health
